<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мой сайт{% endblock %}</title>
    {% load static %}
    {% load extras %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    {% include 'banner.html' %}

    <nav style="background: #343a40; padding: 12px 20px; border-radius: 0 0 8px 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <a href="{% url 'home' %}" style="color: white; margin: 0 15px; text-decoration: none; font-weight: 500;">Главная</a>
        <a href="{% url 'about' %}" style="color: white; margin: 0 15px; text-decoration: none; font-weight: 500;">О нас</a>
        <a href="{% url 'contact' %}" style="color: white; margin: 0 15px; text-decoration: none; font-weight: 500;">Контакты</a>
        <a href="{% url 'form_html' %}" style="color: #a8d8ff; margin: 0 15px; text-decoration: none; font-weight: 500;">HTML Форма</a>
        <a href="{% url 'fields' %}" style="color: #a8d8ff; margin: 0 15px; text-decoration: none; font-weight: 500;">Поля</a>
        <a href="{% url 'userdata' %}" style="color: #a8d8ff; margin: 0 15px; text-decoration: none; font-weight: 500;">Добавить студента</a>
        <a href="{% url 'students_list' %}" style="color: #a8d8ff; margin: 0 15px; text-decoration: none; font-weight: 500;">Студенты</a>
        <a href="{% url 'static_files' %}" style="color: white; margin: 0 15px; text-decoration: none; font-weight: 500;">Статические файлы</a>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
